    <style>
       
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcfcfc;
            color: #333;
            line-height: 1.6;
        }

 
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding: 20px 0;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #333; 
        }

        .logo span {
            color: #632024; 
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            transition: color 0.3s;
            text-transform: uppercase;
            font-size: 14px;
        }

        nav ul li a:hover {
            color: #8a7a5f;
        }

        
        .hero-banner {
            position: relative;
            text-align: center;
            color: white;
            width: 100%;
        }

        .hero-banner img {
            width: 100%;
            display: block;
        }

       
        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.6); 
        }
		 .centered a {
    color: #ffffff;             
    text-decoration: underline;
    text-decoration-color: #ffffff; 
    text-underline-offset: 6px; 
    transition: opacity 0.3s;
}

.centered a:hover {
    opacity: 0.8;
}
    </style>
</head>
